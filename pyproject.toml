[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "df0"
version = "0.1.0"
description = "Python package with Pytorch implementations of differentiable variants of classical fundamental frequency estimators (dYIN and dSWIPE)"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    {name = "Sebastian Strahl", email = "sebastian.strahl@audiolabs-erlangen.de"},
    {name = "Meinard Müller", email = "meinard.mueller@audiolabs-erlangen.de"},
]
dependencies = [
    "torch>=2.0.0",
    "tqdm>=4.0.0",
    "librosa>=0.10.0",
]
requires-python = ">=3.9"

[project.urls]
Homepage = "https://github.com/groupmm/df0"
Repository = "https://github.com/groupmm/df0"

[tool.setuptools.packages.find]
include = ["df0*"]

[project.optional-dependencies]
demo = [
    "ipykernel>=6.0.0",
    "numpy>=2.0.0",
    "ipython>=9.0.0",
    "matplotlib>=3.0.0",
]

[project.scripts]
dswipe = "df0.main:dswipe"
dyin = "df0.main:dyin"
